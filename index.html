<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="description" content="Shoot the gates, grow your squad, survive the horde." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Horde: Last Stand</title>
  </head>
  <body
    class="h-dvh overflow-hidden overscroll-none bg-stone-950 font-sans text-stone-200 antialiased"
  >
    <main
      id="app"
      class="relative mx-auto h-full w-full max-w-[520px] touch-none overflow-hidden select-none"
    >
      <canvas id="game" class="absolute inset-0 block h-full w-full"></canvas>

      <!-- HUD -->
      <div
        id="hud"
        class="pointer-events-none absolute inset-x-0 top-0 hidden px-4 pt-[max(env(safe-area-inset-top),12px)]"
      >
        <div
          class="flex items-center gap-3 border border-stone-700/60 bg-black/70 px-3 py-2 shadow-lg"
        >
          <span class="font-display text-xs tracking-widest text-amber-600">LVL 1</span>
          <div class="h-2 flex-1 overflow-hidden bg-stone-800">
            <div id="hud-progress" class="h-full w-0 bg-red-700"></div>
          </div>
          <span class="font-display text-sm tabular-nums">
            <span id="hud-kills">0</span>
            <span class="text-[10px] text-stone-500">KILLS</span>
          </span>
        </div>
      </div>

      <!-- Wave banner -->
      <div
        id="banner"
        class="pointer-events-none absolute inset-x-0 top-1/3 text-center font-display text-5xl tracking-wider text-stone-200 uppercase opacity-0 drop-shadow-[0_3px_0_rgba(0,0,0,0.9)]"
      ></div>

      <!-- Start screen -->
      <section
        id="screen-start"
        class="absolute inset-0 flex flex-col items-center justify-center gap-8 bg-grime px-8 text-center"
      >
        <div>
          <p class="font-display text-xs tracking-[0.35em] text-amber-600 uppercase">
            Level 1 · Outbreak
          </p>
          <h1 class="mt-3 font-display text-7xl leading-[0.85] text-stone-200 uppercase">
            Horde<br /><span class="text-red-700">Last Stand</span>
          </h1>
        </div>
        <ul class="space-y-2 text-sm text-stone-400">
          <li>Drag to move your squad</li>
          <li>
            <span class="font-bold text-sky-400">Blue</span> gates grow it,
            <span class="font-bold text-red-500">red</span> gates shrink it
          </li>
          <li>Shoot gates to raise their number</li>
          <li>Break ammo crates for upgrades</li>
          <li>They don't stop coming</li>
        </ul>
        <button
          data-action="start"
          class="pointer-events-auto border-2 border-red-950 bg-red-800 px-10 py-4 font-display text-2xl tracking-widest text-stone-100 uppercase shadow-[0_5px_0_#3b0a0a] transition active:translate-y-1 active:shadow-[0_1px_0_#3b0a0a]"
        >
          Deploy
        </button>
      </section>

      <!-- End screen -->
      <section
        id="screen-end"
        class="absolute inset-0 hidden flex-col items-center justify-center gap-6 bg-grime px-8 text-center"
      >
        <h2 id="end-title" class="font-display text-6xl uppercase"></h2>
        <p id="end-subtitle" class="text-stone-400"></p>
        <dl class="grid w-full max-w-xs grid-cols-3 gap-2">
          <div class="border border-stone-700/60 bg-black/50 p-3">
            <dt class="text-[10px] font-bold tracking-widest text-stone-500 uppercase">Kills</dt>
            <dd id="stat-kills" class="font-display text-2xl tabular-nums"></dd>
          </div>
          <div class="border border-stone-700/60 bg-black/50 p-3">
            <dt class="text-[10px] font-bold tracking-widest text-stone-500 uppercase">Peak</dt>
            <dd id="stat-peak" class="font-display text-2xl tabular-nums"></dd>
          </div>
          <div class="border border-stone-700/60 bg-black/50 p-3">
            <dt class="text-[10px] font-bold tracking-widest text-stone-500 uppercase">Time</dt>
            <dd id="stat-time" class="font-display text-2xl tabular-nums"></dd>
          </div>
        </dl>
        <button
          data-action="start"
          class="pointer-events-auto border-2 border-red-950 bg-red-800 px-10 py-4 font-display text-2xl tracking-widest text-stone-100 uppercase shadow-[0_5px_0_#3b0a0a] transition active:translate-y-1 active:shadow-[0_1px_0_#3b0a0a]"
        >
          Redeploy
        </button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
